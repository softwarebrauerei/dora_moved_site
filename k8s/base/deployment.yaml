apiVersion: apps/v1
kind: Deployment
metadata:
  name: dora-moved-site
spec:
  replicas: 2
  revisionHistoryLimit: 3
  strategy:
    rollingUpdate:
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: dora-moved-site
  template:
    metadata:
      labels:
        app.kubernetes.io/name: dora-moved-site
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: nginx
          # tag set in kustomization.yaml (images:)
          image: ghcr.io/softwarebrauerei/dora_moved_site
          env:
            # set per domain in the overlays
            - name: OLD_URL
              value: ""
            - name: NEW_URL
              value: ""
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 30
          resources:
            requests:
              cpu: 5m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        # nginx writes its rendered config, pid and temp files here
        - name: tmp
          emptyDir:
            sizeLimit: 16Mi
